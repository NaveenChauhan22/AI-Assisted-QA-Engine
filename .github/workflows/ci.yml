name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated suite
        env:
          CI: true
          PLAYWRIGHT_RUN_MODE: headless
        run: npm run execute

      - name: Upload reports and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-engine-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
