name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify committed generated specs exist
        run: |
          test -f tests/automated/specs/homepage-navigation.spec.ts
          test -f tests/automated/specs/homepage-discovery.spec.ts
          test -f tests/automated/specs/category-listing.spec.ts
          test -f tests/automated/specs/category-discovery.spec.ts
          test -f tests/automated/specs/product-detail-navigation.spec.ts
